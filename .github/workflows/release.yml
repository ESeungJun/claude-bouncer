name: Release

# Release flow
#   master  — day-to-day development (feature PRs)
#   release — what ships. Open a PR master → release (with the version bumped
#             in package.json); merging it runs this workflow:
#             tests → macOS + Windows installers → draft GitHub release
#             v<version> with them attached.
# Nothing is public until you press "Publish release" on GitHub.
#
# The build jobs run every dependency's install scripts, so they get
# read-only permissions and no stored token; only the small publish job,
# which installs nothing, can write the release. The macOS signing
# certificate and notary key are handed to the packaging step alone.
on:
  push:
    branches: [release]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  test:
    runs-on: macos-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - id: v
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"
      - run: npm ci
      - run: npm test

  build:
    needs: test
    strategy:
      matrix:
        include:
          - os: macos-latest
            target: --mac
          - os: windows-latest
            target: --win
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # not published from here; Windows is still unsigned
      - name: Build installers (Windows)
        if: runner.os == 'Windows'
        run: npx electron-builder ${{ matrix.target }} --publish never
      - name: Build installers (macOS, signed + notarized)
        if: runner.os == 'macOS'
        env:
          CSC_LINK: ${{ secrets.MAC_CERT_P12 }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CERT_PASSWORD }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          if [ -z "$CSC_LINK" ] || [ -z "$APPLE_API_KEY_P8" ]; then
            echo "macOS signing secrets are missing"; exit 1
          fi
          # electron-builder wants the notary key as a file
          export APPLE_API_KEY="$RUNNER_TEMP/AuthKey.p8"
          trap 'rm -f "$APPLE_API_KEY"' EXIT
          printf '%s\n' "$APPLE_API_KEY_P8" > "$APPLE_API_KEY"
          # forceCodeSigning: fail instead of quietly shipping an ad-hoc build
          npx electron-builder ${{ matrix.target }} --publish never -c.mac.forceCodeSigning=true
      - name: Check signature and notarization (macOS)
        if: runner.os == 'macOS'
        run: |
          for app in dist/mac*/*.app; do
            codesign --verify --deep --strict "$app"
            xcrun stapler validate "$app"
            spctl --assess --type execute -vv "$app"
          done
      # only the installers people download: no electron-updater .blockmap /
      # latest*.yml (there is no auto-updater)
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: installers-${{ runner.os }}
          path: |
            dist/*.dmg
            dist/*.zip
            dist/*.exe
          if-no-files-found: error

  publish:
    needs: [test, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: dist
          merge-multiple: true
      - name: Checksums
        run: cd dist && sha256sum -- * > SHA256SUMS && cat SHA256SUMS
      - name: Draft release v${{ needs.test.outputs.version }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ needs.test.outputs.version }}
        run: |
          state=$(gh release view "v$VERSION" --json isDraft --jq .isDraft 2>/dev/null || echo none)
          if [ "$state" = "false" ]; then
            echo "v$VERSION is already published — bump the version in package.json first."; exit 1
          fi
          # a draft from an earlier run of the same version points at an older commit: recreate it
          if [ "$state" = "true" ]; then gh release delete "v$VERSION" --yes; fi
          # SmartScreen guide on top of the generated notes: the Windows build is unsigned
          cat > notes.md <<'NOTES'
          ### Windows 첫 실행
          SmartScreen이 막으면 **추가 정보 → 실행** (More info → Run anyway).

          NOTES
          gh release create "v$VERSION" --draft --target "$GITHUB_SHA" --title "v$VERSION" --notes-file notes.md --generate-notes dist/*
