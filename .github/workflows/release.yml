name: Release

# Release flow
#   master  — day-to-day development (feature PRs)
#   release — what ships. Open a PR master → release (with the version bumped
#             in package.json); merging it runs this workflow:
#             tests → macOS + Windows installers → draft GitHub release
#             v<version> with them attached.
# Nothing is public until you press "Publish release" on GitHub.
#
# The build jobs run every dependency's install scripts, so they get
# read-only permissions and no stored token; only the small publish job,
# which installs nothing, can write the release.
on:
  push:
    branches: [release]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  test:
    runs-on: macos-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - id: v
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"
      - run: npm ci
      - run: npm test

  build:
    needs: test
    strategy:
      matrix:
        include:
          - os: macos-latest
            target: --mac
          - os: windows-latest
            target: --win
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build installers (not published from here)
        run: npx electron-builder ${{ matrix.target }} --publish never
        env:
          # unsigned builds for now (no code-signing certificates yet)
          CSC_IDENTITY_AUTO_DISCOVERY: false
      # only the installers people download: no electron-updater .blockmap /
      # latest*.yml (there is no auto-updater)
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: installers-${{ runner.os }}
          path: |
            dist/*.dmg
            dist/*.zip
            dist/*.exe
          if-no-files-found: error

  publish:
    needs: [test, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: dist
          merge-multiple: true
      - name: Checksums
        run: cd dist && sha256sum -- * > SHA256SUMS && cat SHA256SUMS
      - name: Draft release v${{ needs.test.outputs.version }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ needs.test.outputs.version }}
        run: |
          state=$(gh release view "v$VERSION" --json isDraft --jq .isDraft 2>/dev/null || echo none)
          if [ "$state" = "false" ]; then
            echo "v$VERSION is already published — bump the version in package.json first."; exit 1
          fi
          # a draft from an earlier run of the same version points at an older commit: recreate it
          if [ "$state" = "true" ]; then gh release delete "v$VERSION" --yes; fi
          # Gatekeeper/SmartScreen guide on top of the generated notes: the builds are unsigned
          cat > notes.md <<'NOTES'
          ### macOS 첫 실행
          Apple 공증을 받지 않은 앱이라 "Apple은 'Claude Bouncer'에 … 악성 코드가 없음을 확인할 수 없습니다"가 떠요. 앱을 응용 프로그램 폴더로 옮겨 한 번 열어본 뒤, **시스템 설정 → 개인정보 보호 및 보안** 아래쪽의 **그래도 열기**를 누르세요. 버튼이 없거나 "손상되었다"고 나오면 터미널에서 한 번 실행하세요.
          ```bash
          xattr -dr com.apple.quarantine "/Applications/Claude Bouncer.app"
          ```
          The app isn't notarized: open it once, then press **Open Anyway** in **System Settings → Privacy & Security** (or run the command above).

          ### Windows 첫 실행
          SmartScreen이 막으면 **추가 정보 → 실행** (More info → Run anyway).

          NOTES
          gh release create "v$VERSION" --draft --target "$GITHUB_SHA" --title "v$VERSION" --notes-file notes.md --generate-notes dist/*
